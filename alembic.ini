# Alembic configuration for MoneyPrinterTurbo agentic knowledge video domain

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

# Default local connection string; override via DATABASE_URL environment variable
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/moneyprinterturbo

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
